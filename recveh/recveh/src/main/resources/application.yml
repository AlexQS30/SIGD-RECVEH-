# ═══════════════════════════════════════════
# SIGD-RECVEH | Configuración principal
# Spring Boot 4.0.6 | PostgreSQL 18
# ═══════════════════════════════════════════

spring:
  application:
    name: sigd-recveh

  datasource:
    url: jdbc:postgresql://localhost:5432/sigd_recveh
    username: postgres
    password: 85857855
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
    expiration-ms: 28800000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.sigd.recveh: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: INFO